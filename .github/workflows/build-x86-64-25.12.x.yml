name: Build 25.12.x x86-64
on:
  workflow_dispatch:
    inputs:
      luci_version:
        description: "选择luci版本"
        required: false
        default: "25.12.1"
        type: choice
        options:
          - 25.12.0
          - 25.12.1
      custom_router_ip:
        description: "请设置路由器的管理地址(仅对多网口路由器有效) 格式:192.168.x.1 或 10.x.x.1"
        required: true
        default: "192.168.100.1"
      profile:
        description: '选择软件包空间大小'
        required: true
        type: choice
        default: '4G'
        options:
          - '1G'
          - '2G'
          - '3G'
          - '4G'
      enable_store:
        description: "集成 store 商店"
        required: false
        type: boolean
        default: false
      include_docker:
        description: |
          是否编译 Docker 插件
        required: true
        default: 'no'
        type: choice
        options:
          - 'yes'
          - 'no'
      enable_pppoe:
        description: "是否配置PPPoE拨号信息?"
        required: true
        default: 'no'
        type: choice
        options:
        - 'yes'
        - 'no'
      pppoe_account:
        description: "宽带账号 (若启用PPPoE)"
        required: false
      pppoe_password:
        description: "宽带密码 (若启用PPPoE)"
        required: false

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-22.04

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set executable permissions
        run: chmod +x ${{ github.workspace }}/x86-64/build25.sh

      - name: Set date for tag
        id: set_date
        run: echo "date=$(date +%Y%m%d)" >> $GITHUB_OUTPUT

      - name: Save Custom Router IP into OpenWrt files
        run: |
          mkdir -p "${{ github.workspace }}/custom"
          echo "${{ inputs.custom_router_ip }}" > "${{ github.workspace }}/custom/custom_router_ip.txt"
          echo "您设置的路由器管理地址是:${{ inputs.custom_router_ip }}"
          # 后续步骤会将该文件映射到路由器/etc/config/custom_router_ip.txt 以便用于开机脚本99-custom.sh读取用户设置的ip
      
      - name: Validate PPPoE Inputs
        run: |
          if [[ "${{ inputs.enable_pppoe }}" == "yes" ]]; then
            if [[ -z "${{ inputs.pppoe_account }}" || -z "${{ inputs.pppoe_password }}" ]]; then
              echo "Error: PPPoE account and password must be provided when PPPoE is enabled!"
              exit 1
            fi
          fi
      
      - name: Enable Store integration
        run: |
          mkdir -p shell
          if [ "${{ inputs.enable_store }}" == "true" ]; then
            echo 'CUSTOM_PACKAGES="$CUSTOM_PACKAGES luci-app-store"' >> shell/apk-custom-packages.sh
            echo "✅ 已追加 luci-app-store"
          else
            echo "❎ 未启用 luci-app-store"
          fi

      - name: Build ImmortalWrt-x86-64-efi 25.12.x
        run: |
          profile="${{ inputs.profile }}"
          case "$profile" in
            1G)
              ROOTFS_SIZE=1024
              ;;
            2G)
              ROOTFS_SIZE=2048
              ;;
            3G)
              ROOTFS_SIZE=3072
              ;;
            4G)
              ROOTFS_SIZE=4096
              ;;
          esac
          echo "ROOTFS_SIZE=$ROOTFS_SIZE" >> $GITHUB_ENV
          include_docker="${{ inputs.include_docker }}"
          luci_version="${{ inputs.luci_version }}"
          echo "Building for rootfs_size: $profile"
          docker run --rm -i \
            --user root \
            -v "${{ github.workspace }}/bin:/home/build/immortalwrt/bin" \
            -v "${{ github.workspace }}/files:/home/build/immortalwrt/files" \
            -v "${{ github.workspace }}/custom:/home/build/immortalwrt/files/etc/config" \
            -v "${{ github.workspace }}/x86-64/imm25.config:/home/build/immortalwrt/.config" \
            -v "${{ github.workspace }}/shell:/home/build/immortalwrt/shell" \
            -v "${{ github.workspace }}/x86-64/build25.sh:/home/build/immortalwrt/build.sh" \
            -e PROFILE="$ROOTFS_SIZE" \
            -e INCLUDE_DOCKER="$include_docker" \
            -e ENABLE_PPPOE="${{ inputs.enable_pppoe }}" \
            -e PPPOE_ACCOUNT="${{ inputs.pppoe_account }}" \
            -e PPPOE_PASSWORD="${{ inputs.pppoe_password }}" \
          immortalwrt/imagebuilder:x86-64-openwrt-${luci_version} /bin/bash /home/build/immortalwrt/build.sh

      - name: Compress VMDK files
        run: |
          VMDK_DIR="${{ github.workspace }}/bin/targets/x86/64"
          if ls "$VMDK_DIR"/*.vmdk 1> /dev/null 2>&1; then
            echo "Compressing VMDK files..."
            gzip -9 -v "$VMDK_DIR"/*.vmdk
          else
            echo "No VMDK files found to compress."
          fi

      - name: Create info
        run: |
          cat > ${{ github.workspace }}/router-info.md <<EOF
          ## 📡 路由器后台信息
          <a href="https://wkdaily.cpolar.cn/archives/1">
           <img src="https://img.shields.io/badge/若下载慢可套用国内加速站下载-FC7C0D?logo=github&logoColor=fff&labelColor=000&style=for-the-badge"/>
          </a>
          
          - 🏠 **后台地址**: ${{ inputs.custom_router_ip }}
          - 👤 **用户名**: root
          - 🔑 **密码**: 无
          EOF

          if [ "${{ inputs.include_docker }}" == "yes" ]; then
            echo -e "\n#### 包含 Docker 支持" >> "${{ github.workspace }}/router-info.md"
          else
            echo -e "\n#### 不包含 Docker 支持" >> "${{ github.workspace }}/router-info.md"
          fi

      - name: Prepare assets
        run: |
          mkdir -p "${{ github.workspace }}/upload-assets"
          cp ${{ github.workspace }}/bin/targets/x86/64/*combined-efi.img.gz upload-assets/ || true
          # 复制压缩后的 .vmdk.gz
          if ls ${{ github.workspace }}/bin/targets/x86/64/*.vmdk.gz 1> /dev/null 2>&1; then
            cp ${{ github.workspace }}/bin/targets/x86/64/*.vmdk.gz upload-assets/
          fi
          # 复制 .sha256（如果存在）
          if ls ${{ github.workspace }}/bin/targets/x86/64/*.sha256 1> /dev/null 2>&1; then
            cp ${{ github.workspace }}/bin/targets/x86/64/*.sha256 upload-assets/
          fi
          if [ -z "$(ls -A upload-assets)" ]; then
            echo "No assets found, exiting gracefully"
            exit 1
          fi

      - name: Upload ImmortWrt as release assets
        uses: softprops/action-gh-release@v3
        with:
          tag_name: ${{ steps.set_date.outputs.date }}-x86-64-${{ inputs.luci_version }}
          body_path: ${{ github.workspace }}/router-info.md
          files: ${{ github.workspace }}/upload-assets/*
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
